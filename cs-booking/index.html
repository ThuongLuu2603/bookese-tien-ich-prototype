<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookese • Prototype CS</title><style>:root{--nav:#2a3042;--bg:#f8f8fb;--text:#495057;--muted:#74788d;--brand:#00b8d9;--link:#0069ef;--line:#e8ebf0;--orange:#ef9222;--green:#209d70;--red:#d9534f}*{box-sizing:border-box}body{margin:0;font:14px Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:1px solid #dfe3e8;background:white;color:var(--text);border-radius:5px;padding:10px 16px}button:hover{border-color:var(--brand)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button.danger{background:#d9534f;color:white;border-color:#d9534f}button.link{background:transparent;border:0;color:var(--link);padding:0}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:3px solid #6bd5e5;outline-offset:2px}#demo{height:43px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff4dd;border-bottom:1px solid #eddfbf;font-size:12px;position:sticky;top:0;z-index:30}#demo select{max-width:250px;padding:4px;border:1px solid #ddcda9;background:white}#demo span{margin-right:auto}aside{position:fixed;top:43px;left:0;bottom:0;width:224px;background:var(--nav);color:#b0b6c5;overflow:auto}.logo{font-size:36px;letter-spacing:-1px;font-weight:800;color:#0065ee;padding:25px 26px 28px}.navitem{display:block;padding:14px 25px;color:#b0b6c5;font-size:13px}.navitem.active{color:#18badd;background:#30384d}.navsub{padding-left:45px;font-size:12px}.topbar{height:63px;background:white;margin-left:224px;display:flex;align-items:center;justify-content:flex-end;padding:0 32px;gap:22px;border-bottom:1px solid #f0f1f5}main{margin-left:224px;padding:28px;max-width:1850px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:19px;margin:0;font-weight:600}h2{font-size:16px;margin:0 0 20px}h3{font-size:14px;margin:0 0 15px}.crumb{font-size:12px;color:var(--muted)}.card{background:white;border-radius:5px;padding:24px;margin-bottom:20px;border:1px solid #f0f1f5;box-shadow:0 2px 8px #12263f03}.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:13px}.field input,.field select,.field textarea,.filter input,.filter select{padding:10px 12px;border:1px solid #d8dce2;border-radius:4px;color:#495057;width:100%;background:white}.field textarea{min-height:82px;resize:vertical}.field small,.muted{color:var(--muted);font-size:12px}.field .error{color:#be3e3b}.required:after{content:' *';color:#d9534f}.filter{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:16px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tabs a{padding:15px 18px;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent}.tabs a.active{color:#dc8314;border-color:var(--orange)}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:12px;background:#f8f8fb;color:#61677a;font-weight:600;padding:15px 12px}td{padding:17px 12px;border-bottom:1px solid #eef0f3;vertical-align:top;line-height:1.6}.tablewrap{overflow:auto}td small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:20px;padding:4px 10px;font-size:12px;white-space:nowrap;background:#e6f4fb;color:#178ab2}.badge.good{background:#e5f7ee;color:#21865e}.badge.warn{background:#fff1d8;color:#a67508}.badge.bad{background:#fdecea;color:#c14b42}.badge.neutral{background:#eeeef2;color:#777b8a}.alert{padding:14px 18px;background:#fff6e4;color:#876118;border-left:3px solid #efaf3b;line-height:1.6;margin-bottom:20px;font-size:13px}.alert.info{background:#eaf7fc;color:#226b87;border-color:#19a9d2}.alert.success{background:#e8f6ef;color:#25734f;border-color:#37a470}.stats{display:flex;gap:40px;padding:18px 0}.stats strong{display:block;font-size:20px;margin:8px 0}.kv{display:grid;grid-template-columns:180px 1fr;gap:0}.kv div{padding:12px 0;border-bottom:1px solid #f1f2f5}.kv div:nth-child(odd){color:var(--muted)}.summary{padding:18px;background:#f8f9fc;border-radius:5px}.summary strong{font-size:19px}.note{font-size:12px;color:var(--muted);line-height:1.7}.timeline{border-left:2px solid #e4edf4;margin-left:7px;padding-left:25px}.event{position:relative;margin-bottom:25px;line-height:1.6}.event:before{content:'';position:absolute;width:10px;height:10px;background:#20a4c9;border-radius:50%;left:-31px;top:5px}.steps{display:flex;gap:15px;margin:15px 0 25px}.step{padding:9px 12px;background:#edf6fa;color:#298ca8;border-radius:4px;font-size:12px}.step.now{background:#00b8d9;color:white}.tick{display:flex;gap:10px;align-items:flex-start;line-height:1.6;margin:12px 0}.tick input{margin-top:5px}.empty{text-align:center;padding:65px 20px;color:var(--muted)}.right{text-align:right}.hotellabel{padding:18px 22px;background:#f8f9fd;border-left:4px solid #169ee8;margin-bottom:20px}.hotellabel b{font-size:18px}.money{font-variant-numeric:tabular-nums}.statusline{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0}.statusline div{font-size:12px}.statusline .badge{margin-left:6px}.customer aside{background:white;border-right:1px solid #e5e8ed;width:242px;top:110px}.customer .navitem{color:#444}.customer .navitem.active{background:#eaf7fd;color:#0069ef}.customer .topbar{margin:0;height:67px;justify-content:space-between}.customer main{margin-left:242px}.customer .card{border-radius:12px}.customer .logo{padding:0;font-size:30px}.customer h1{font-size:22px}.customer .bookcard{border:1px solid #e8edf4;border-radius:8px;padding:20px;margin:15px 0}.customer .tabs a.active{color:#0069ef;border-color:#0069ef}#toast{display:none;position:fixed;bottom:25px;right:25px;padding:18px 26px;border-radius:6px;background:#263648;color:white;z-index:100;max-width:550px}dialog{border:0;border-radius:10px;max-width:580px;width:90%;padding:26px;box-shadow:0 12px 50px #0003;color:var(--text)}dialog::backdrop{background:#18243255}dialog h2{margin-bottom:16px}dialog p{line-height:1.7}.pagefooter{font-size:11px;color:#8b90a1;margin-top:25px}.demoGuide{border-left:4px solid #1b93bb}.demoGuide ol{line-height:2}.paycards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.paycards div{padding:16px;background:#f8f9fc}.paycards b{display:block;margin-top:8px}.full{grid-column:1/-1}@media(max-width:1100px){aside{width:190px}.topbar,main{margin-left:190px}.filter{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}#demo{gap:8px}}@media(max-width:760px){aside,.customer aside{display:none}.topbar,main,.customer main{margin-left:0}main{padding:16px}.grid,.grid3{grid-template-columns:1fr}.filter{grid-template-columns:1fr}.kv{grid-template-columns:130px 1fr}#demo{height:auto;min-height:43px;flex-wrap:wrap;padding:8px}.pagehead{gap:12px}.crumb{display:none}}
</style><body><div id="demo"></div><div id="app"></div><dialog id="dialog"></dialog><div id="toast" role="status"></div><script>/* Bookese CS — editable, local-only prototype. No backend or payment calls. */
const screens={S01:'Danh sách đặt phòng',S02:'Chi tiết đặt phòng',S03:'Thanh toán & tra soát',S04:'Reconfirm với khách sạn',S05:'Yêu cầu hỗ trợ',S06:'Phương án thay thế',S07:'Đổi thông tin booking',S08:'Hủy & xin miễn phí',S09:'Hoàn tiền & xu',S10:'Lịch sử xử lý',S11:'Danh sách vé máy bay',S12:'Chi tiết vé & Hồng Ngọc Hà',S13:'Khách hàng • Lịch sử đặt chỗ',S14:'Khách hàng • Chi tiết booking',S15:'Khách hàng • Yêu cầu hủy',S16:'Extranet • Xác nhận booking'};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({role:'CS',activeBooking:'BK-DEMO-2409',scenario:'success',reconfirm:false,request:null,alternative:null,change:null,cancel:null,refund:null,logs:[],updated:'24/09/2026 10:00',guestConsent:false});
let st;try{st=JSON.parse(localStorage.getItem('bookese-cs-prototype-v1'))||seed()}catch{st=seed()}
let screen=location.hash.slice(1)||'S01';
function save(){localStorage.setItem('bookese-cs-prototype-v1',JSON.stringify(st))}
function log(t){st.logs.unshift({time:new Date().toLocaleString('vi-VN'),actor:st.role,text:t});save()}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}
function go(s){if(location.hash==='#'+s)render();else location.hash=s}
function badge(t,k=''){return `<span class="badge ${k}">${esc(t)}</span>`}
function field(label,id,type='text',value='',hint='',required=false){return `<div class="field"><label for="${id}" class="${required?'required':''}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}><small>${hint}</small></div>`}
function select(label,id,values,selected){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}">${values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function textfield(label,id,value='',required=false){return `<div class="field full"><label for="${id}" class="${required?'required':''}">${label}</label><textarea id="${id}" name="${id}" ${required?'required':''}>${esc(value)}</textarea></div>`}
function tick(label,id,checked=false){return `<label class="tick"><input id="${id}" name="${id}" type="checkbox" ${checked?'checked':''}> <span>${label}</span></label>`}
function btn(label,action,cls='',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function link(label,s){return `<a href="#${s}">${label}</a>`}
function alert(t,cls=''){return `<div class="alert ${cls}">${t}</div>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function kv(rows){return `<div class="kv">${rows.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join('')}</div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bookingState(){return st.scenario==='failed'?'Thất bại':st.scenario==='success'?'Thành công':'Đang xử lý'}
function paid(){return st.scenario!=='pendingpay'}
function statusline(){return `<div class="statusline"><div>Booking ${badge(bookingState(),bookingState()==='Thành công'?'good':'warn')}</div><div>Thanh toán ${badge(paid()?'Đã thu tiền':'Chưa xác minh',paid()?'good':'warn')}</div><div>Dịch vụ ${badge(st.cancel?.status==='Đã hủy'?'Đã hủy phần được xác nhận':st.cancel?'Đang xử lý hủy':'Chưa sử dụng','neutral')}</div><div>Reconfirm ${badge(bookingState()!=='Thành công'?'Chưa cần reconfirm':st.reconfirm?'KS đã xác nhận':'Chờ xác nhận',st.reconfirm?'good':'warn')}</div></div>`}
function bookingHeader(){return `<div class="hotellabel"><div class="row spread"><div><b>BK-DEMO-2409</b> · Khách sạn Biển Xanh <small class="muted">Dữ liệu minh họa</small></div>${link('← Danh sách','S01')}</div>${statusline()}<div class="muted">Khách Nguyễn An · 28–30/09/2026 · 2 phòng Deluxe · 4 khách · ${money(4200000)} + 200.000 xu đã dùng</div></div><nav class="tabs">${[['S02','Tổng quan'],['S03','Thanh toán'],['S04','Reconfirm'],['S05','Hỗ trợ'],['S06','Phương án'],['S07','Đổi booking'],['S08','Hủy'],['S09','Hoàn tiền & xu'],['S10','Lịch sử']].map(([s,t])=>`<a href="#${s}" class="${screen===s?'active':''}">${t}</a>`).join('')}</nav>`}
function list(){return card('Tìm kiếm đơn đặt phòng',`<form id="search"><div class="filter">${field('Mã booking / email / SĐT','q','search','','Ví dụ BK-DEMO hoặc an.demo')}${select('Kết quả booking','state',['Tất cả','Thành công','Đang xử lý','Thất bại'])}${select('Thanh toán','payfilter',['Tất cả','Đã thu tiền','Chưa xác minh'])}${select('Reconfirm','reconfilter',['Tất cả','Chờ xác nhận','KS đã xác nhận'])}</div><div class="actions">${btn('Đặt lại','reset-search')}<button class="primary">Tìm kiếm</button></div></form>`)+card('Đơn đặt phòng',`<nav class="tabs"><a class="active" href="#S01">Tất cả <b>3</b></a><a href="#S01" data-action="filter-pending">Đang xử lý</a><a href="#S01" data-action="filter-reconfirm">Chờ reconfirm</a><a href="#S01" data-action="filter-refund">Có khoản hoàn</a></nav><div id="results"></div><div class="row spread note"><span>Hiển thị tối đa 20 đơn/trang · Giữ bộ lọc khi quay lại danh sách</span><span>Trang 1 / 1</span></div>`)}
function listRows(query='',state='Tất cả',pay='Tất cả',recon='Tất cả'){
 const all=[['BK-DEMO-2409','Nguyễn An','an.demo@example.com',bookingState(),paid()?'Đã thu tiền':'Chưa xác minh',st.reconfirm?'KS đã xác nhận':'Chờ xác nhận','28–30/09/2026'],['BK-DEMO-2410','Trần Bình','binh.demo@example.com','Đang xử lý','Chưa xác minh','Chưa cần reconfirm','28–30/09/2026'],['BK-DEMO-2411','Lê Chi','chi.demo@example.com','Thất bại','Đã thu tiền','Chưa cần reconfirm','28–30/09/2026']];
 const rows=all.filter(r=>(r.join(' ').toLowerCase().includes(query.toLowerCase()))&&(state==='Tất cả'||r[3]===state)&&(pay==='Tất cả'||r[4]===pay)&&(recon==='Tất cả'||r[5]===recon));
 document.querySelector('#results').innerHTML=rows.length?table(['Mã đặt phòng','Khách hàng','Lưu trú','Kết quả booking','Thanh toán / reconfirm','Tổng đã trả',''],rows.map((r,i)=>[`<button class="link" data-openbooking="${r[0]}">${r[0]}</button>`,`${r[1]}<small>${r[2]}</small>`,`Biển Xanh<small>${r[6]}</small>`,badge(r[3],r[3]==='Thành công'?'good':r[3]==='Thất bại'?'bad':'warn'),`${r[4]}<small>${r[5]}</small>`,money(4200000),`<button class="link" data-openbooking="${r[0]}">Xem chi tiết →</button>`])):`<div class="empty">Không tìm thấy booking phù hợp.<p>${btn('Xóa bộ lọc','reset-search')}</p></div>`;
}
function overview(){return bookingHeader()+`<div class="split"><div>${card('Thông tin đặt chỗ',kv([['Ngày nhận / trả','28/09/2026 14:00 → 30/09/2026 12:00'],['Phòng','2 × Deluxe, 2 đêm · Giường đôi · Có bữa sáng'],['Khách lưu trú','Nguyễn An · 4 người lớn'],['Liên hệ','090•••0123 · an.demo@example.com'],['Yêu cầu đặc biệt','Tầng cao — yêu cầu chờ KS xác nhận, chưa bảo đảm'],['Mã tại NCC','NCC-DEMO-9090'],['Nguồn cung','KS trực tiếp · Hợp đồng DEMO'],['Hóa đơn','Chưa yêu cầu xuất hóa đơn']]))}${card('Điều kiện đã chốt khi đặt',alert('<b>Miễn phí nếu gửi yêu cầu trước 27/09/2026 12:00 (GMT+7).</b><br>Thời gian báo trước cho khách = thời gian NCC yêu cầu + 2 giờ. Ví dụ NCC yêu cầu trước nhận phòng 24 giờ → khách cần gửi trước 26 giờ.','info')+`<p>Thông tin phòng, quyền lợi, giá và chính sách được lưu theo phiên bản lúc đặt. Không thay bằng chính sách hiện tại.</p>${link('Xem / thực hiện yêu cầu hủy','S08')}`)}</div><div>${card('Thanh toán',kv([['Giá dịch vụ',money(4400000)],['Xu đã sử dụng','200.000 xu = 200.000 đ trong dữ liệu demo'],['Tiền đã thanh toán',`<b>${money(4200000)}</b>`],['Xu thưởng đang chờ','84.000 xu'],['Phương thức','OnePay · Thẻ ••••1234']])+`<div class="actions">${link('Chi tiết thanh toán →','S03')}</div>`)}${card('Thao tác CS',`<div class="row">${link('Reconfirm với KS','S04')}${link('Ghi nhận hỗ trợ','S05')}${link('Đổi booking','S07')}${link('Hủy / miễn phí','S08')}${link('Theo dõi hoàn','S09')}</div><p class="note">KS không tự hủy booking đã xác nhận. Đến muộn không tự làm mất quyền sử dụng phòng trong thời gian đã mua.</p>`)}</div></div>`}
function payment(){let pending=st.scenario==='pendingpay';return bookingHeader()+alert(pending?'Khách báo đã bị trừ tiền; Bookese chưa xác minh được tiền về. Không yêu cầu thanh toán lại khi giao dịch cũ chưa rõ.':st.scenario==='pendingncc'?'Đã thu tiền; chưa có kết quả xuất từ NCC. Tra cứu đơn thật trước khi gửi lại lệnh.':st.scenario==='failed'?'Booking thất bại: dừng xuất dịch vụ; vẫn theo dõi tiền và xu cần hoàn.':'Đã ghi nhận thanh toán. Có thể tra soát khi khách phản ánh sai số tiền.','info')+card('Hai bước cần đối chiếu',`<div class="paycards"><div>1. Đơn vị thanh toán<b>${pending?'Chờ kết quả xác minh':'Thành công · 4.200.000 đ'}</b></div><div>2. Bookese ghi nhận<b>${pending?'Chưa ghi nhận':'Đã thu tiền'}</b></div><div>3. NCC cung cấp<b>${st.scenario==='pendingncc'?'Đã gửi · chưa trả kết quả':bookingState()}</b></div></div>${kv([['Mã giao dịch','PAY-DEMO-2409'],['Mã đối soát / tham chiếu','REF-DEMO-9910'],['Phương thức','OnePay / thẻ · tra soát theo đơn vị thanh toán thực tế'],['Thời điểm gửi / nhận','24/09/2026 10:00 / '+(pending?'Chưa có':'10:01')],['Đã gửi yêu cầu xuất','24/09/2026 10:01 · REQ-DEMO-01'],['Lần đối chiếu gần nhất',esc(st.updated)]])}<div class="actions">${btn('Tra cứu trạng thái mới nhất','retrieve','primary')}${btn('Đề nghị Tech kiểm tra','tech')}</div><p class="note">Tra cứu chỉ đọc kết quả. CS không được tự sửa “đã thu tiền” hoặc tự gửi lại lệnh xuất khi chưa xác minh.</p>`)+card('Tra soát giao dịch / không tìm thấy booking',`<form id="trace"><div class="grid">${select('Phương thức','trace-method',['Thẻ qua OnePay','Chuyển khoản tự động','Ví điện tử'])}${field('Mã giao dịch hoặc tham chiếu','trace-ref','text','','Không yêu cầu số thẻ đầy đủ, CVV hoặc OTP.',true)}${field('Số tiền khách bị trừ','trace-amount','number',4200000,'',true)}${field('Thời điểm giao dịch','trace-time','datetime-local','2026-09-24T10:00','',true)}${textfield('Nội dung cần đối chiếu / bằng chứng đã che dữ liệu','trace-note','Khách báo đã bị trừ tiền. Đối chiếu tiền, booking và nhà cung cấp.',true)}</div><div class="actions"><button class="primary">Ghi nhận và chuyển Kế toán / Tech</button></div></form>`)}

function change(){return bookingHeader()+card('Đổi booking — lấy báo giá trước khi thực hiện',`<form id="change"><div class="grid">${field('Ngày nhận mới','change-in','date','2026-10-02','',true)}${field('Ngày trả mới','change-out','date','2026-10-04','',true)}${field('Hạng phòng / số phòng','change-room','text','Deluxe · 2 phòng','',true)}${field('Giá mới gồm thuế phí (đ)','change-price','number',4800000,'Giá gốc dịch vụ: 4.400.000 đ.',true)}${field('Báo giá có hiệu lực đến','change-expire','datetime-local','2026-09-24T14:00','',true)}${field('Tham chiếu xác nhận NCC','change-ref','text','','',true)}</div>${tick('Khách đồng ý giá, điều kiện mới và phương án xử lý tiền / xu','change-consent')}<div class="summary" id="change-preview"></div><div class="actions"><button class="primary">Ghi nhận phương án đổi</button></div></form>`)+(st.change?card('Theo dõi thực hiện đổi',`<p>Chênh lệch: <b>${money(st.change.delta)}</b> · ${badge(st.change.done?'Đã đổi thành công':'Chờ thực hiện','warn')}</p>${alert(st.change.delta>0?'Phải xác minh khoản thu bổ sung trước khi thực hiện. Nếu tiền đã thu nhưng đổi thất bại, xử lý riêng khoản tiền bổ sung; không hủy nhầm booking gốc.':'Nếu đủ điều kiện hoàn chênh lệch: chuyển hoàn tiền và xu. Không tự hoàn khi điều kiện mới chưa chốt.','info')}${tick('Đã đối chiếu tiền bổ sung (nếu có) và NCC xác nhận đổi thành công','change-done-proof')}<div class="actions">${btn('Xác nhận đổi thành công','change-done','primary',st.change.done)}${link('Theo dõi hoàn chênh lệch','S09')}</div>`):'')+card('Xu khi đổi dịch vụ',`<p>Hủy lô xu thưởng đang chờ của phương án cũ và tính lại theo phương án mới. Mức thưởng dùng mức cao hơn giữa mức đã khóa và hạng hiện tại; báo lại khách trước xác nhận. Nếu hạn mức dùng xu giảm, trả lại phần xu dùng vượt hạn mức. Nếu hạn mức tăng, không tự trừ thêm xu.</p><p class="note">Prototype chưa mô phỏng bảng hạn mức từng sản phẩm; Dev lấy chính sách xu đã duyệt, không dùng chênh lệch tiền làm tỷ lệ xu mặc định.</p>`) }

function need(id,message){if(!document.getElementById(id)?.checked){toast(message);return false}return true}
function dialog(title,body,confirmText,run){const d=document.querySelector('#dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="actions"><button id="dialog-back">Quay lại</button>${confirmText?`<button id="dialog-confirm" class="primary">${confirmText}</button>`:''}</div>`;d.querySelector('#dialog-back').onclick=()=>d.close();if(confirmText)d.querySelector('#dialog-confirm').onclick=()=>{d.close();run()};d.showModal()}
function cancelNumbers(){let share=document.querySelector('#cancel-share').value.startsWith('100')?1:.5;let rule=document.querySelector('#cancel-rule').value;let factor=rule.includes('toàn bộ')||rule.includes('trong hạn')?0:rule.includes('50%')?.5:1;let fees=(Number(document.querySelector('#cancel-nccfee').value)+Number(document.querySelector('#cancel-bkfee').value))*factor;return {share,fees,rule,cash:4200000*share-fees,spent:200000*share}}
function cancelPreview(){const c=cancelNumbers();document.querySelector('#cancel-preview').innerHTML=`<b>Khách sạn: phí NCC + phí Bookese cùng tỷ lệ hỗ trợ</b><p>Phí giữ lại: ${money(c.fees)} · Tiền hoàn: <b>${money(Math.max(0,c.cash))}</b> · Xu đã dùng trả lại: <b>${c.spent.toLocaleString('vi-VN')} xu</b></p><small>Hạn khách gửi: 27/09 12:00. Hạn NCC: 27/09 14:00. Báo trước +2 giờ để có thời gian xử lý.</small>`}
function changePreview(){let p=Number(document.querySelector('#change-price').value);document.querySelector('#change-preview').innerHTML=`<p>Chênh lệch dịch vụ: <b>${money(p-4400000)}</b> ${p>4400000?'— cần thu bổ sung trước khi đổi':p<4400000?'— kiểm tra điều kiện hoàn chênh lệch':'— không phát sinh thêm tiền'}</p>`}
function customerPreview(){let share=document.querySelector('#cc-scope').selectedIndex===0?1:.5;document.querySelector('#cc-preview').innerHTML=`<p><b>Mô phỏng yêu cầu còn hạn miễn phí:</b> phí hủy 0 đ</p><p>Tiền hoàn dự kiến: ${money(4200000*share)} · Xu dùng trả lại: ${(200000*share).toLocaleString('vi-VN')} xu</p><p>Xu thưởng đang chờ hủy: ${(84000*share).toLocaleString('vi-VN')} xu. Kết quả cuối cùng được cập nhật sau khi NCC xác nhận.</p>`}
function bind(){document.querySelector('#screen-picker').onchange=e=>go(e.target.value);document.querySelector('#role-picker').onchange=e=>{st.role=e.target.value;save();render()};document.querySelector('#scenario-picker').onchange=e=>{st=Object.assign(seed(),{role:st.role,scenario:e.target.value});save();render()};document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>actions[e.dataset.action]?.());document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();submits[f.id]?.(values(f))});document.querySelector('#app').onclick=e=>{const b=e.target.closest('[data-openbooking]');if(b){const id=b.dataset.openbooking;if(id!==(st.activeBooking||'BK-DEMO-2409')){st=Object.assign(seed(),{role:st.role,activeBooking:id,scenario:id==='BK-DEMO-2410'?'pendingpay':id==='BK-DEMO-2411'?'failed':'success'});}save();go('S02')}};['cancel-share','cancel-rule','cancel-nccfee','cancel-bkfee'].forEach(id=>{if(document.getElementById(id))document.getElementById(id).oninput=cancelPreview});if(document.querySelector('#change-price'))document.querySelector('#change-price').oninput=changePreview;if(document.querySelector('#cc-scope'))document.querySelector('#cc-scope').onchange=customerPreview;if(document.querySelector('#flight-search'))document.querySelector('#flight-search').oninput=e=>{document.querySelector('#flight-results').style.display='FL-DEMO-0001 DEMO26 NGUYEN AN'.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'}}
const actions={
 reset:()=>dialog('Đặt lại dữ liệu mô phỏng?','<p>Xóa các thao tác đã thử trong prototype trên trình duyệt này.</p>','Đặt lại',()=>{st=seed();save();render()}),
 guide:()=>dialog('Cách duyệt prototype',`<ol><li>S01 → S02: tìm và mở booking.</li><li>Chọn “Treo thanh toán” hoặc “Treo tại NCC” ở thanh demo → S03.</li><li>S04: reconfirm; hoặc S16 để thử phản hồi từ KS.</li><li>S05 → S06: tiếp nhận vấn đề và chốt phương án thay.</li><li>S08: hủy / xin miễn → tra cứu kết quả → S09.</li><li>S09: CS gửi đề nghị → đổi vai Trưởng CS duyệt → Kế toán gửi hoàn, đối chiếu tiền và xu.</li><li>S14: xem kết quả phía khách. S10: kiểm tra lịch sử.</li><li>S12: nghiệp vụ vé làm trực tiếp với Hồng Ngọc Hà.</li></ol><p>File Excel chứa yêu cầu chi tiết và tiêu chí nghiệm thu cho từng màn. Mọi nút chỉ mô phỏng; bộ lọc vai trò là công cụ duyệt, không phải quyền thật.</p>`),
 'coin-comp':()=>dialog('Đề nghị cấp lô xu bù 30 ngày','<p>Chỉ áp dụng khi lỗi Bookese/NCC làm xu trả lại đã hết hạn. Không sửa hạn lô gốc; cần bằng chứng và người duyệt.</p><textarea id="comp-proof" rows="4" style="width:100%" placeholder="Giao dịch gốc, số xu hết hạn, nguyên nhân và bằng chứng"></textarea>','Lưu đề nghị',()=>{const v=document.querySelector('#comp-proof').value.trim();if(!v)return toast('Cần căn cứ và lô gốc.');log('CS đề nghị lô bù 30 ngày, chờ duyệt: '+v);toast('Đã lưu đề nghị; chưa cấp xu.')}),
 'filter-pending':()=>{document.querySelector('#state').value='Đang xử lý';document.querySelector('#payfilter').value='Tất cả';document.querySelector('#reconfilter').value='Tất cả';listRows('','Đang xử lý')},
 'filter-reconfirm':()=>{document.querySelector('#reconfilter').value='Chờ xác nhận';document.querySelector('#state').value='Tất cả';listRows('','Tất cả','Tất cả','Chờ xác nhận')},
 'filter-refund':()=>{if(st.refund)listRows('BK-DEMO-2409');else document.querySelector('#results').innerHTML='<div class="empty">Chưa có khoản hoàn trong dữ liệu demo. Mở booking → Hủy → Hoàn tiền & xu để tạo đề nghị.</div>'},
 'reset-search':()=>{document.querySelector('#search').reset();listRows()},
 retrieve:()=>{st.updated=new Date().toLocaleString('vi-VN');log('Tra cứu trạng thái thanh toán / NCC; giữ nguyên khi chưa có kết quả đối chiếu mới');render();toast('Đã tra cứu. Kịch bản đang treo vẫn chưa có kết quả mới; không tự chuyển thành công.')},
 tech:()=>dialog('Đề nghị Tech kiểm tra','<p>Gắn mã booking, giao dịch, yêu cầu NCC và lỗi gần nhất. CS theo dõi phản hồi khách.</p>','Ghi nhận',()=>{log('Đề nghị Tech kiểm tra kết nối / trạng thái; không gửi lệnh xuất lại');toast('Đã ghi vào lịch sử booking')}),
 'recon-issue':()=>{go('S05');toast('Ghi nhận nội dung KS phản hồi và mức độ gấp.')},
 'close-support':()=>dialog('Ghi kết quả hỗ trợ','<p>Chỉ kết thúc khi đã có kết quả thông báo khách. Nếu còn tiền / xu chưa hoàn, vẫn theo dõi khoản hoàn riêng.</p><textarea id="close-note" rows="4" style="width:100%" placeholder="Kết quả thực tế và nội dung đã báo khách"></textarea>','Lưu kết quả',()=>{const v=document.querySelector('#close-note').value.trim();if(!v)return toast('Cần ghi kết quả thực tế.');log('Kết quả hỗ trợ: '+v);toast('Đã lưu; khoản tiền/xu còn chờ vẫn giữ tiến độ riêng.')}),
 'alt-reject':()=>{log('Khách từ chối phương án; tiếp tục tìm phương án phù hợp');toast('Đã ghi nhận. Chưa thay booking gốc.')},
 'alt-done':()=>{if(st.alternative?.payer.startsWith('Bookese')&&st.role!=='Trưởng CS')return toast('Cần người có thẩm quyền duyệt khoản Bookese chi trước.');log('NCC xác nhận phương án đã thực hiện; CS xác nhận khách đã nhận phòng');toast('Đã ghi kết quả vào lịch sử.')},
 'change-done':()=>{if(!need('change-done-proof','Cần xác minh tiền bổ sung và kết quả NCC.'))return;st.change.done=true;log('Đổi booking thành công; điều chỉnh lô xu thưởng theo phương án mới');render()},
 'cancel-pending':()=>{log('Đã ghi yêu cầu xin miễn phí; chưa gửi hủy, chưa xác định khoản hoàn cuối cùng');toast('Đã lưu xin miễn phí. Booking vẫn được giữ.')},
 'cancel-result':()=>{st.cancel.status='Đã hủy';log('Đối chiếu NCC xác nhận hủy thành công đúng phạm vi');render()},
 'refund-approve':()=>{if(st.role!=='Trưởng CS')return toast('Chưa đủ quyền.');st.refund.status='Đã duyệt';log('Duyệt đề nghị hoàn đúng số tiền và xu đã đối chiếu');render()},
 'refund-send':()=>{if(st.role!=='Kế toán'||st.refund.status!=='Đã duyệt')return;dialog('Gửi hoàn về phương thức gốc',`<p>Hoàn ${money(refundCalculation().cash)} cho giao dịch PAY-DEMO-2409. Yêu cầu RF-DEMO-001 sẽ được dùng để tránh gửi trùng.</p>`,'Gửi hoàn mô phỏng',()=>{st.refund.status='Đang hoàn';st.refund.ref='REFUND-DEMO-001';log('Gửi hoàn RF-DEMO-001; chờ kết quả đơn vị thanh toán');render()})},
 'refund-result':()=>{if(st.role!=='Kế toán')return;st.refund.status='Cổng báo thành công';log('Kế toán đối chiếu mã hoàn REFUND-DEMO-001 thành công; chưa xác nhận khách nhận tiền');render()},
 'refund-received':()=>{st.refund.status='Khách đã nhận tiền';log('CS ghi nhận khách xác nhận nhận tiền');render()},
 'refund-coins':()=>{if(!['Kế toán','Trưởng CS'].includes(st.role)||st.refund.coins)return;st.refund.coins=true;log('Đối chiếu ledger: trả xu đã dùng về lô gốc; hủy phần xu thưởng đang chờ');render()},
 'flight-retrieve':()=>{log('Tra cứu Hồng Ngọc Hà / hãng: vé đã xuất; không phát sinh lệnh xuất / hoàn mới');toast('Trạng thái vé đã xuất không thay đổi. Đã lưu lần đối chiếu.')},
 'customer-help':()=>dialog('Liên hệ Bookese',`<p>Yêu cầu gắn với booking BK-DEMO-2409.</p><textarea id="customer-note" rows="5" style="width:100%" placeholder="Bạn cần Bookese hỗ trợ nội dung gì?"></textarea>`,'Gửi yêu cầu',()=>{const n=document.querySelector('#customer-note').value.trim();if(!n)return toast('Vui lòng nhập nội dung cần hỗ trợ.');log('Khách gửi hỗ trợ: '+n);toast('Đã ghi nhận yêu cầu trong bản mô phỏng.')}),
 'ex-problem':()=>dialog('Báo không thể phục vụ','<p>Thông tin gửi về CS; không tự hủy booking của khách.</p>','Gửi phản hồi',()=>{log('KS báo không thể phục vụ qua Extranet; CS cần xử lý với khách');toast('Đã gửi phản hồi. Booking chưa bị hủy.')})
};
const submits={
 search:v=>listRows(v.q,v.state,v.payfilter,v.reconfilter),
 trace:v=>{if(Number(v['trace-amount'])<=0)return toast('Số tiền phải lớn hơn 0.');log('Tra soát '+v['trace-method']+' · '+v['trace-ref']+' · '+money(Number(v['trace-amount'])));toast('Đã lưu tra soát cho Kế toán / Tech; chưa xác nhận tiền về.')},
 reconfirm:v=>{if(!need('ks-room','Cần đối chiếu phòng, ngày và tên khách.')||!need('ks-benefits','Cần đối chiếu quyền lợi đã mua.'))return;st.reconfirm={source:v['ks-source'],person:v['ks-person'],time:v['ks-time'],proof:v['ks-proof']};log('Reconfirm KS: '+v['ks-code']+' qua '+v['ks-source']);render()},
 support:v=>{st.request={note:v['req-note'],urgent:v['req-urgent'],due:v['req-due'],time:v['req-time']};log('Tiếp nhận '+v['req-type']+' · '+v['req-urgent']);render();toast('Đã lưu yêu cầu gắn với booking.')},
 alternative:v=>{if(!need('alt-consent','Cần khách đồng ý phương án.')||!need('alt-available','Cần xác minh phòng thay có thật.'))return;st.alternative={hotel:v['alt-hotel'],scope:v['alt-scope'],payer:v['alt-payer'],price:Number(v['alt-price'])};log('Chốt phương án với khách: '+v['alt-type']+'; '+v['alt-payer']);render()},
 change:v=>{if(v['change-in']>=v['change-out'])return toast('Ngày trả phải sau ngày nhận.');if(Number(v['change-price'])<=0)return toast('Giá mới phải lớn hơn 0.');if(!need('change-consent','Cần khách đồng ý điều kiện mới.'))return;st.change={delta:Number(v['change-price'])-4400000,done:false};log('Ghi nhận báo giá đổi booking; chờ tiền và kết quả NCC');render()},
 cancel:v=>{if(st.cancel)return;if(!need('cancel-consent','Cần khách đồng ý phạm vi và khoản hoàn.'))return;let c=cancelNumbers();if(c.cash<0||Number(v['cancel-nccfee'])<0||Number(v['cancel-bkfee'])<0)return toast('Phí không hợp lệ hoặc vượt tiền của phần dịch vụ. Cần kiểm tra lại.');dialog('Xác nhận gửi hủy',`<p>${esc(v['cancel-scope'])}</p><p>Tiền dự kiến ${money(c.cash)}; trả ${c.spent.toLocaleString('vi-VN')} xu. Sau khi gửi, chờ NCC trả kết quả.</p>`,'Gửi yêu cầu mô phỏng',()=>{st.cancel={...c,scope:v['cancel-scope'],status:'Đang xử lý hủy'};log('Gửi hủy CANCEL-DEMO-001, lưu thời điểm khách yêu cầu '+v['cancel-time']);render()})},
 refund:v=>{if(st.refund)return;if(v['refund-reason'].startsWith('Hoàn chênh lệch')||v['refund-reason'].startsWith('NCC hỗ trợ bổ sung'))return toast('Demo tính tiền đang minh họa hủy/booking thất bại. Hoàn chênh lệch và hoàn bổ sung theo yêu cầu RQ-029/036/057, không dùng số tiền toàn đơn ở đây.');if(v['refund-route'].startsWith('Phương án khác'))return toast('Cần quy trình xác minh người nhận và phê duyệt riêng; chưa gửi trong demo.');if(v['refund-reason']==='Hủy đã xác nhận'&&st.cancel?.status!=='Đã hủy')return toast('Chưa có kết quả hủy NCC. Kiểm tra tại màn Hủy.');if(v['refund-reason'].startsWith('Booking thất bại')&&st.scenario!=='failed')return toast('Booking chưa ở trạng thái thất bại.');if(v['refund-reason'].startsWith('Hoàn chênh lệch')&&(!st.change?.done||st.change.delta>=0))return toast('Cần có kết quả đổi sang giá thấp hơn.');st.refund={status:'Chờ duyệt',coins:false,ref:null};log('CS lập đề nghị hoàn RF-DEMO-001; chưa phát lệnh tiền');render()},
 handoff:v=>{log(v['handoff-type']+': '+v['handoff-note']+' · Hẹn '+v['handoff-time']);render()},
 'flight-request':v=>{if(!need('flight-consent','Cần điều kiện vé, phản hồi NCC và khách đồng ý.'))return;log('CS làm trực tiếp Hồng Ngọc Hà: '+v['flight-type']+' · '+v['flight-ref']);toast('Đã lưu yêu cầu. Báo giá hoàn cuối cùng chờ chốt quy tắc phí vé.')},
 'customer-cancel':v=>{if(!need('cc-consent','Vui lòng xác nhận đã đọc thông tin hoàn hủy.'))return;let share=v['cc-scope']==='Toàn bộ booking'?1:.5;st.cancel={share,fees:0,scope:v['cc-scope'],status:'Đang xử lý hủy'};log('Khách gửi yêu cầu hủy; hệ thống chuyển NCC và chờ kết quả');go('S14');toast('Đã nhận yêu cầu hủy. Chưa hoàn tiền cho đến khi có kết quả.')},
 extranet:v=>{if(!need('ex-consent','Khách sạn cần xác nhận nội dung phục vụ.'))return;st.reconfirm={source:'Extranet',person:v['ex-person'],time:new Date().toLocaleString('vi-VN'),proof:v['ex-note']};log('KS reconfirm qua Extranet: '+v['ex-code']);toast('Đã đồng bộ phản hồi sang màn CS.');go('S04')}
};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
